server:
  port: 8083

spring:
  application:
    name: search-service

services:
  job-service:
    url: ${JOB_SERVICE_URL:http://job-service:8081}

search:
  pagination:
    max-size: ${SEARCH_PAGINATION_MAX_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.jobportal.searchservice: INFO
