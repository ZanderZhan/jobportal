server:
  port: 8086

spring:
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
  datasource:
    url: jdbc:postgresql://localhost:5432/jobportal
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:jobportal}
    password: ${SPRING_RABBITMQ_PASSWORD:jobportal}
    listener:
      simple:
        missing-queues-fatal: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  task:
    scheduling:
      pool:
        size: 2

notification:
  topology:
    declare-locally: ${NOTIFICATION_DECLARE_TOPOLOGY_LOCALLY:false}
  mail:
    from-address: ${NOTIFICATION_MAIL_FROM_ADDRESS:no-reply@jobportal.local}
    from-name: ${NOTIFICATION_MAIL_FROM_NAME:Job Portal Notifications}
  retry:
    batch-size: ${NOTIFICATION_RETRY_BATCH_SIZE:20}
    backoff-minutes: ${NOTIFICATION_RETRY_BACKOFF_MINUTES:5}
    max-email-attempts: ${NOTIFICATION_RETRY_MAX_EMAIL_ATTEMPTS:3}
    max-recipient-warmup-retries: ${NOTIFICATION_RETRY_MAX_RECIPIENT_WARMUP_RETRIES:3}
    recipient-recovery-minutes: ${NOTIFICATION_RETRY_RECIPIENT_RECOVERY_MINUTES:30}
    fixed-delay: ${NOTIFICATION_RETRY_FIXED_DELAY:300000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.jobportal.notificationservice: INFO
