spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/.well-known/jwks.json
  datasource:
    url: jdbc:h2:mem:notificationdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false
  task:
    scheduling:
      enabled: false

notification:
  mail:
    from-address: test@jobportal.local
    from-name: Job Portal Test Mailer
  retry:
    batch-size: 10
    backoff-minutes: 5
    max-email-attempts: 3
    max-recipient-warmup-retries: 2
    recipient-recovery-minutes: 15
    fixed-delay: 600000

management:
  endpoints:
    access:
      default: none
