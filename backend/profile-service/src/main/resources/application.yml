server:
  port: 8085

spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://localhost:5432/jobportal
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

profile:
  correlation-id-header: ${PROFILE_CORRELATION_ID_HEADER:X-Request-ID}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.jobportal.profileservice: DEBUG
