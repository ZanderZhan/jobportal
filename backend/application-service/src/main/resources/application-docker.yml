server:
  port: 8084

spring:
  application:
    name: application-service
  datasource:
    url: jdbc:postgresql://postgres:5432/jobportal
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.jobportal.applicationservice: INFO

services:
  job-service:
    url: ${JOB_SERVICE_URL:http://job-service:8081}
    connect-timeout-ms: ${JOB_SERVICE_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${JOB_SERVICE_READ_TIMEOUT_MS:2000}
