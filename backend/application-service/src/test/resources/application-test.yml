spring:
  datasource:
    url: jdbc:h2:mem:application-service-testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  job-service:
    url: http://localhost:8081
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
