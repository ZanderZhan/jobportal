server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes: []
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:}

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  correlation-id-header: X-Request-ID

services:
  job-service:
    url: ${JOB_SERVICE_URL:http://job-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,gateway
  endpoint:
    health:
      show-details: always
  health:
    gateway:
      enabled: true

logging:
  level:
    com.jobportal.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
