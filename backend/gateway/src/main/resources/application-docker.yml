server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://auth-service:8082/.well-known/jwks.json}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burst-capacity: 100
  data:
    redis:
      host: redis
      port: 6379

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  correlation-id-header: X-Request-ID

services:
  job-service:
    url: ${JOB_SERVICE_URL:http://job-service:8081}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8082}
  application-service:
    url: ${APPLICATION_SERVICE_URL:http://application-service:8084}
  profile-service:
    url: ${PROFILE_SERVICE_URL:http://profile-service:8085}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,gateway
  endpoint:
    health:
      show-details: always
  health:
    gateway:
      enabled: true

logging:
  level:
    com.jobportal.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG

resilience4j:
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 60s
        timeoutDuration: 100ms

  circuitbreaker:
    instances:
      jobService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

  retry:
    instances:
      jobService:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
